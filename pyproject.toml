[project]
name = "video-subtitle-ocr"
version = "0.1.0"
description = "Local hard-subtitle OCR with standard subtitle exports"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rapidocr==3.10.0",
    "onnxruntime-directml==1.24.4",
    "opencv-python-headless==4.12.0.88",
    "numpy>=2,<2.3",
    "Pillow>=11,<13",
    "imageio-ffmpeg==0.6.0",
]

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.pycodestyle]
max-line-length = 110
